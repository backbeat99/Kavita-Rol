<ng-container *transloco="let t; prefix:'locked-field'">
  <div class="input-group lock-btn" [class.lock-active]="locked()">
    <button class="input-group-text clickable" type="button"
            [attr.aria-label]="t('protect-field')" [attr.aria-pressed]="locked()"
            (click)="toggle()">
        <i class="fa" [class.fa-lock]="locked()" [class.fa-lock-open]="!locked()" aria-hidden="true"></i>
    </button>
    <ng-content />
  </div>
</ng-container>
